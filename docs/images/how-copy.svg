<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" role="img" aria-labelledby="t d">
<title id="t">A copy between two computers</title>
<desc id="d">You start a copy in the browser. The job runs on the receiving agent, which asks the sending agent for the list of files and then pulls the file data straight from it. The copy resumes after a dropped network or a restart and is checked on both ends.</desc>
<style>
:root{--bg:#f6f8fb;--edge:#dde3ec;--card:#ffffff;--line:#c9d1dd;--ink:#1f2633;--mute:#5d6878;--acc:#2f6bd8;--accsoft:#eaf1fd;--grn:#1d8a5f;--grnsoft:#e5f4ed;--amb:#b7771a;--ambsoft:#fbf2e2}
@media (prefers-color-scheme:dark){:root{--bg:#141922;--edge:#2a3240;--card:#1c2330;--line:#3a4558;--ink:#e6ebf2;--mute:#9aa6b8;--acc:#78a6ff;--accsoft:#1b2a45;--grn:#4cc38a;--grnsoft:#15302a;--amb:#e3aa52;--ambsoft:#372a15}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.h{font-size:18px;font-weight:700}.sub{font-size:13px;fill:var(--mute)}
.t{font-size:15px;font-weight:650}.s{font-size:12.5px;fill:var(--mute)}
.c{font-size:12.5px;font-weight:600}.l{font-size:12px;fill:var(--mute)}.n{font-size:12px;font-weight:700;fill:var(--bg)}
.bg{fill:var(--bg);stroke:var(--edge)}.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.agent{fill:var(--accsoft);stroke:var(--acc);stroke-width:1.5}
.ia{fill:var(--accsoft);stroke:var(--acc);stroke-width:1.4}.ig{fill:var(--ambsoft);stroke:var(--amb);stroke-width:1.3}.id{fill:var(--grnsoft);stroke:var(--grn);stroke-width:1.3}
.ar{stroke:var(--acc);stroke-width:2;fill:none}.dash{stroke:var(--mute);stroke-width:1.6;fill:none;stroke-dasharray:5 5}
.big{stroke:var(--grn);stroke-width:7;fill:none;stroke-linecap:round}
.ha{fill:var(--acc)}.hm{fill:var(--mute)}.hd{fill:var(--grn)}.hg{fill:var(--amb)}
.badge{fill:var(--card);stroke:var(--line)}
.lab{fill:var(--bg)}
</style>
<defs>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ha"/></marker>
<marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="hm"/></marker>
<marker id="md" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" class="hd"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="879" height="391" rx="18"/>
<text class="h" x="32" y="40">A copy between two computers</text>
<text class="sub" x="32" y="61">The receiving agent pulls the files straight from the sending one. Your browser only watches.</text>

<!-- browser -->
<rect class="card" x="330" y="82" width="220" height="56" rx="14"/>
<rect class="ia" x="344" y="97" width="28" height="22" rx="4"/><path d="M344 103.5h28" class="ar" stroke-width="1.3"/>
<text class="c" x="384" y="106">You press Copy</text>
<text class="l" x="384" y="124">progress shows live</text>
<path class="dash" d="M552 110C 650 110, 722 116, 722 147" marker-end="url(#mm)"/>
<rect class="lab" x="574" y="84" width="128" height="18" rx="4"/><text class="l" x="638" y="97" text-anchor="middle">via your own agent</text>

<!-- source -->
<rect class="card" x="32" y="150" width="250" height="150" rx="16"/>
<text class="t" x="50" y="178">Laptop</text><text class="s" x="264" y="178" text-anchor="end">sending</text>
<rect class="agent" x="50" y="192" width="214" height="40" rx="10"/><text class="c" x="157" y="216.5" text-anchor="middle">agent</text>
<rect class="id" x="50" y="244" width="214" height="36" rx="8"/><circle cx="66" cy="262" r="3" class="hd"/><text class="s" x="78" y="266.5">disk: Photos, 5 000 files</text>

<!-- destination -->
<rect class="card" x="598" y="150" width="250" height="150" rx="16"/>
<text class="t" x="616" y="178">Home server</text><text class="s" x="830" y="178" text-anchor="end">receiving</text>
<rect class="agent" x="616" y="192" width="214" height="40" rx="10"/><text class="c" x="723" y="216.5" text-anchor="middle">agent runs the job</text>
<rect class="ig" x="616" y="244" width="100" height="36" rx="8"/><text class="s" x="666" y="266.5" text-anchor="middle">disk queue</text>
<rect class="id" x="724" y="244" width="106" height="36" rx="8"/><circle cx="740" cy="262" r="3" class="hd"/><text class="s" x="752" y="266.5">disk</text>

<!-- flows -->
<path class="ar" d="M612 205H270" marker-end="url(#ma)"/>
<circle cx="316" cy="190" r="9" class="ha"/><text class="n" x="316" y="194" text-anchor="middle">1</text>
<text class="l" x="332" y="194">“which files?” then “send me these”</text>
<path class="big" d="M274 254H588" marker-end="url(#md)"/>
<circle cx="316" cy="282" r="9" class="hd"/><text class="n" x="316" y="286" text-anchor="middle">2</text>
<text class="l" x="332" y="286">file data streams agent to agent</text>

<!-- badges -->
<rect class="badge" x="32" y="322" width="264" height="44" rx="12"/>
<text class="c" x="164" y="340" text-anchor="middle">Picks up where it stopped</text>
<text class="l" x="164" y="356" text-anchor="middle">after a dropped network or a restart</text>
<rect class="badge" x="308" y="322" width="264" height="44" rx="12"/>
<text class="c" x="440" y="340" text-anchor="middle">Checked on both ends</text>
<text class="l" x="440" y="356" text-anchor="middle">every file hashed while it travels</text>
<rect class="badge" x="584" y="322" width="264" height="44" rx="12"/>
<text class="c" x="716" y="340" text-anchor="middle">No half files</text>
<text class="l" x="716" y="356" text-anchor="middle">a file gets its real name when complete</text>
</svg>
