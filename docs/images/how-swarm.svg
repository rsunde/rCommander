<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="t d">
<title id="t">rCommander on several computers</title>
<desc id="d">A desktop, a laptop and a home server each run their own agent. Your browser talks only to the desktop's agent, which relays to the others with the shared key. The agents find each other with a beacon on the local network. A guest signs in with a password and sees shared folders only, read-only.</desc>
<style>
:root{--bg:#f6f8fb;--edge:#dde3ec;--card:#ffffff;--line:#c9d1dd;--ink:#1f2633;--mute:#5d6878;--acc:#2f6bd8;--accsoft:#eaf1fd;--grn:#1d8a5f;--grnsoft:#e5f4ed;--amb:#b7771a;--ambsoft:#fbf2e2;--vio:#7a58d1;--viosoft:#f0ebfc}
@media (prefers-color-scheme:dark){:root{--bg:#141922;--edge:#2a3240;--card:#1c2330;--line:#3a4558;--ink:#e6ebf2;--mute:#9aa6b8;--acc:#78a6ff;--accsoft:#1b2a45;--grn:#4cc38a;--grnsoft:#15302a;--amb:#e3aa52;--ambsoft:#372a15;--vio:#a88cfa;--viosoft:#29224a}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.h{font-size:18px;font-weight:700}.sub{font-size:13px;fill:var(--mute)}
.t{font-size:15px;font-weight:650}.s{font-size:12.5px;fill:var(--mute)}
.c{font-size:12.5px;font-weight:600}.l{font-size:11.5px;fill:var(--mute)}
.bg{fill:var(--bg);stroke:var(--edge)}.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.agent{fill:var(--accsoft);stroke:var(--acc);stroke-width:1.5}
.ia{fill:var(--accsoft);stroke:var(--acc);stroke-width:1.4}.ig{fill:var(--ambsoft);stroke:var(--amb);stroke-width:1.3}.id{fill:var(--grnsoft);stroke:var(--grn);stroke-width:1.3}.iv{fill:var(--viosoft);stroke:var(--vio);stroke-width:1.4}
.ar{stroke:var(--acc);stroke-width:2;fill:none}.arv{stroke:var(--vio);stroke-width:2;fill:none}
.ha{fill:var(--acc)}.hv{fill:var(--vio)}.hg{fill:var(--amb)}.hd{fill:var(--grn)}
.lan{stroke:var(--grn);stroke-width:2;fill:none;stroke-dasharray:2 6;stroke-linecap:round}
.tick{stroke:var(--grn);stroke-width:1.6;fill:none;stroke-dasharray:2 5;stroke-linecap:round}
.lab{fill:var(--bg)}
</style>
<defs>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ha"/></marker>
<marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hv"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="879" height="519" rx="18"/>
<text class="h" x="32" y="40">A swarm of computers</text>
<text class="sub" x="32" y="61">Every computer runs its own agent. No central server, no cloud.</text>

<!-- You -->
<rect class="card" x="32" y="84" width="248" height="62" rx="14"/>
<rect class="ia" x="48" y="100" width="30" height="22" rx="4"/><path d="M48 106.5h30" class="ar" stroke-width="1.3"/>
<text class="t" x="90" y="110">Your browser</text>
<text class="s" x="90" y="129">talks only to its own agent</text>

<!-- Guest -->
<rect class="card" x="600" y="84" width="248" height="62" rx="14"/>
<rect class="iv" x="616" y="96" width="20" height="32" rx="4"/><path d="M622 123h8" class="arv" stroke-width="1.4"/>
<text class="t" x="648" y="110">A guest, with a password</text>
<text class="s" x="648" y="129">shared folders only, read-only</text>

<!-- machines -->
<g>
<rect class="card" x="32" y="200" width="248" height="170" rx="16"/>
<text class="t" x="50" y="228">Desktop</text>
<rect class="agent" x="50" y="242" width="212" height="44" rx="10"/><text class="c" x="156" y="269" text-anchor="middle">agent</text>
<rect class="ig" x="50" y="296" width="100" height="28" rx="7"/><circle cx="64" cy="310" r="4" class="hg"/><text class="s" x="76" y="314.5">tray</text>
<rect class="id" x="158" y="296" width="104" height="28" rx="7"/><circle cx="172" cy="310" r="2.6" class="hd"/><text class="s" x="182" y="314.5">disks</text>
<text class="l" x="50" y="352">Windows, the one you sit at</text>
</g>
<g>
<rect class="card" x="316" y="200" width="248" height="170" rx="16"/>
<text class="t" x="334" y="228">Laptop</text>
<rect class="agent" x="334" y="242" width="212" height="44" rx="10"/><text class="c" x="440" y="269" text-anchor="middle">agent</text>
<rect class="ig" x="334" y="296" width="100" height="28" rx="7"/><circle cx="348" cy="310" r="4" class="hg"/><text class="s" x="360" y="314.5">tray</text>
<rect class="id" x="442" y="296" width="104" height="28" rx="7"/><circle cx="456" cy="310" r="2.6" class="hd"/><text class="s" x="466" y="314.5">disks</text>
<text class="l" x="334" y="352">Windows or Linux</text>
</g>
<g>
<rect class="card" x="600" y="200" width="248" height="170" rx="16"/>
<text class="t" x="618" y="228">NAS / home server</text>
<rect class="agent" x="618" y="242" width="212" height="44" rx="10"/><text class="c" x="724" y="269" text-anchor="middle">agent</text>
<rect class="id" x="618" y="296" width="212" height="28" rx="7"/><circle cx="632" cy="310" r="2.6" class="hd"/><text class="s" x="642" y="314.5">disks, shared folders</text>
<text class="l" x="618" y="352">Linux, runs as a service</text>
</g>

<!-- browser to own agent -->
<path class="ar" d="M156 148V239" marker-end="url(#ma)" marker-start="url(#ma)"/>
<rect class="lab" x="164" y="176" width="64" height="18" rx="4"/><text class="l" x="168" y="189">localhost</text>
<!-- guest to server -->
<path class="arv" d="M800 148V239" marker-end="url(#mv)"/>
<rect class="lab" x="704" y="176" width="88" height="18" rx="4"/><text class="l" x="788" y="189" text-anchor="end">over the LAN</text>
<!-- relay -->
<path class="ar" d="M264 264H331" marker-end="url(#ma)"/>
<path class="ar" d="M220 198C 280 150, 620 150, 690 197" marker-end="url(#ma)"/>
<rect class="lab" x="356" y="152" width="168" height="20" rx="4"/><text class="l" x="440" y="166" text-anchor="middle">relays, with the shared key</text>

<!-- LAN beacon -->
<path class="tick" d="M156 372V418"/><path class="tick" d="M440 372V418"/><path class="tick" d="M724 372V418"/>
<path class="lan" d="M48 420H832"/>
<circle cx="156" cy="420" r="5" class="hd"/><circle cx="440" cy="420" r="5" class="hd"/><circle cx="724" cy="420" r="5" class="hd"/>
<text class="c" x="440" y="452" text-anchor="middle">Home network: each agent sends a small beacon, the others hear it</text>
<text class="s" x="440" y="474" text-anchor="middle">LAN mode on, one shared key on every computer. Or type the addresses of the others.</text>
<text class="s" x="440" y="494" text-anchor="middle">Any pane can show any computer; copies go straight from agent to agent.</text>
</svg>
