name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: rCommander version
      description: Help ▸ About shows it.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Computer
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Step in the install and test guide (if any)
      placeholder: 3.3
  - type: textarea
    id: what
    attributes:
      label: What did you do?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened instead?
      description: Screenshots help. Help ▸ Report a problem… fills this in for you. Do not attach settings.json, it contains passwords and keys.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics bundle
      description: "In rCommander: Help ▸ Report a problem… builds a zip you can read first, with paths, machine names and addresses masked. Save it and drag it into this box."
